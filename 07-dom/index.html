<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript DOM</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1 id="titulo">JavaScript DOM</h1>

        <p id="descripcion">
            Manipulación de elementos HTML utilizando JavaScript.
        </p>

        <section class="card">

            <h2>Perfil</h2>

            <p id="nombre">Nombre: José</p>

            <p id="profesion">
                Profesión: Analista Programador
            </p>

            <button id="btnCambiar">
                Cambiar información
            </button>

        </section>

        <section class="card">

            <h2>Contador</h2>

            <p id="contador">0</p>

            <div class="botones">

                <button id="btnRestar">
                    -
                </button>

                <button id="btnSumar">
                    +
                </button>

                <button id="btnReset">
                    Reiniciar
                </button>

            </div>

        </section>

        <section class="card">

            <h2>Lista de tecnologías</h2>

            <ul id="listaTecnologias">
                <li>JavaScript</li>
                <li>Python</li>
                <li>PHP</li>
            </ul>

            <button id="btnAgregar">
                Agregar tecnología
            </button>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
